server.port=8080

# Application Metadata
spring.application.name=Smart Crop Decision & Farm Management System

# MySQL Primary Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_crop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# H2 Console (available when running with -Dspring-boot.run.profiles=h2 or standalone)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.smartcrop=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
